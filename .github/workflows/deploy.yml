# main 브랜치에 올라오면 빌드해서 결과물(dist)을 deploy 브랜치에 저장한다.
# 미니PC는 1분마다 deploy 브랜치를 확인해서 바뀌었으면 받아 간다 (server/autodeploy 참고).
name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # 미니PC의 보이드 서버 코드와 프롬프트. 미니PC 자동 배포가 공개 폴더(dist) 밖 ~/dorobus/void로 옮긴다
      - name: 보이드 서버 묶기
        run: |
          mkdir -p dist/_void/server dist/_void/src/game
          cp server/void-server.mjs server/void-demo.mjs server/auth.mjs dist/_void/server/
          cp src/accounts.js dist/_void/src/
          cp -r server/prompts dist/_void/server/
          cp src/game/repairCases.js dist/_void/src/game/
          echo '{"type":"module"}' > dist/_void/package.json

      - name: dist를 deploy 브랜치에 올리기
        env:
          MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7}: $(printf '%s' "$MSG" | head -n1)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
