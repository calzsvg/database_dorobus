<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-label="자동차부터 원격수리까지"><style>text{font-family:Malgun Gothic,Arial,sans-serif}</style><rect width="1100" height="220" rx="18" fill="#f2f7fa"/><rect x="20" y="35" width="194" height="150" rx="13" fill="white" stroke="#b8d4d6"/><text x="35" y="65" font-size="13" fill="#137f7b">01</text><text x="35" y="95" font-size="18" font-weight="bold" fill="#17283d">자동차 도입 미션</text><text x="35" y="126" font-size="13" fill="#4b5c72">면허 없이 시작</text><text x="35" y="150" font-size="12" fill="#4b5c72">원인 + 시험 2개 통과</text><text x="218" y="116" font-size="22" fill="#567">→</text><rect x="238" y="35" width="194" height="150" rx="13" fill="white" stroke="#b8d4d6"/><text x="253" y="65" font-size="13" fill="#137f7b">02</text><text x="253" y="95" font-size="18" font-weight="bold" fill="#17283d">운전면허 발급</text><text x="253" y="126" font-size="13" fill="#4b5c72">완료와 함께 확정</text><text x="253" y="150" font-size="12" fill="#4b5c72">자동차 이외 사건 입장</text><text x="436" y="116" font-size="22" fill="#567">→</text><rect x="456" y="35" width="194" height="150" rx="13" fill="white" stroke="#b8d4d6"/><text x="471" y="65" font-size="13" fill="#137f7b">03</text><text x="471" y="95" font-size="18" font-weight="bold" fill="#17283d">축제 수리 6종</text><text x="471" y="126" font-size="13" fill="#4b5c72">최초 완료 → 부품</text><text x="471" y="150" font-size="12" fill="#4b5c72">서로 다른 4종 완료</text><text x="654" y="116" font-size="22" fill="#567">→</text><rect x="674" y="35" width="194" height="150" rx="13" fill="white" stroke="#b8d4d6"/><text x="689" y="65" font-size="13" fill="#137f7b">04</text><text x="689" y="95" font-size="18" font-weight="bold" fill="#17283d">퍼레이드 수리</text><text x="689" y="126" font-size="13" fill="#4b5c72">4개 원인 · 2개 시험</text><text x="689" y="150" font-size="12" fill="#4b5c72">원격수리 자격 해금</text><text x="872" y="116" font-size="22" fill="#567">→</text><rect x="892" y="35" width="194" height="150" rx="13" fill="white" stroke="#b8d4d6"/><text x="907" y="65" font-size="13" fill="#137f7b">05</text><text x="907" y="95" font-size="18" font-weight="bold" fill="#17283d">원격 배송 수리</text><text x="907" y="126" font-size="13" fill="#4b5c72">remote_repair 필요</text><text x="907" y="150" font-size="12" fill="#4b5c72">본편 스토리와 독립</text></svg>